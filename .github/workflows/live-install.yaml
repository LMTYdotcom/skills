name: Live install

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: "1"

jobs:
  claude-code:
    name: Claude Code from GitHub
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1"
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      # $RUNNER_TEMP is not available to a job-level env block.
      - name: Isolate the Claude config
        run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude" >> "$GITHUB_ENV"

      # Unpinned on purpose: the install is tested against the version a
      # user gets today.
      - run: npm install -g @anthropic-ai/claude-code # zizmor: ignore[adhoc-packages]

      - name: Marketplace add and install
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add ${{ github.repository }}
          claude plugin install lmty@lmty-plugins
          claude plugin list | tee list.txt
          grep -q "lmty@lmty-plugins" list.txt
          find -L "$CLAUDE_CONFIG_DIR" -name SKILL.md -path "*skills*" | tee skills.txt
          test "$(wc -l < skills.txt)" -ge 1

  skills-cli:
    name: skills CLI from GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: npx skills add owner/repo
        run: |
          npx -y skills add ${{ github.repository }} --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee list.txt
          grep -q "competitive-battlecard" list.txt
